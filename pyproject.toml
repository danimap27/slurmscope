[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slurmscope"
version = "1.3.0"
description = "Orquestador de barridos de experimentos en clústeres SLURM con panel de resultados, historial de ejecuciones y estimación de tiempos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Daniel Martín Pérez", email = "danimp2002@gmail.com" }]
keywords = ["slurm", "hpc", "experiment-tracking", "sweep", "job-array", "reproducibility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console :: Curses",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
slurmscope = "slurmscope.cli:main"

[tool.setuptools.packages.find]
include = ["slurmscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
